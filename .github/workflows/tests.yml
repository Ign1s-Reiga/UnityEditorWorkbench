name: EditMode tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: EditMode tests
    runs-on: ubuntu-latest

    # Forked pull requests do not receive secrets, so activation would always fail.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      # Keep the workflow green until the licence secrets exist, instead of failing
      # every run. Remove nothing here once configured; the gate simply passes.
      - name: Check licence configuration
        id: licence
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        run: |
          if [ -z "$UNITY_EMAIL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity licence secrets are not configured. Skipping EditMode tests."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.licence.outputs.configured == 'true'
        uses: actions/checkout@v4

      # Library is a build cache. Restoring it turns a cold import into an incremental one.
      - name: Cache Library
        if: steps.licence.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run EditMode tests
        if: steps.licence.outputs.configured == 'true'
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.5.2f1
          testMode: editmode
          projectPath: .
          artifactsPath: TestResults
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode results

      - name: Upload results
        if: always() && steps.licence.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: editmode-results
          path: TestResults
          if-no-files-found: warn
